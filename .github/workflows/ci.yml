name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run poe lint

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Static and unit checks
        run: uv run poe check

      - name: Integration tests
        run: uv run poe test-integration

      - name: Pip audit
        run: uv run pip-audit

      - name: OPA policy tests
        uses: open-policy-agent/setup-opa@v2

      - name: Run OPA tests
        run: opa test infra/opa/policies infra/opa/tests

      - name: Docker build targets
        run: |
          docker build --target gateway -f docker/Dockerfile .
          docker build --target support-agent -f docker/Dockerfile .
          docker build --target settlement-agent -f docker/Dockerfile .
          docker build --target finance-approval -f docker/Dockerfile .
          docker build --target mcp-orders -f docker/Dockerfile .
          docker build --target mcp-crm -f docker/Dockerfile .
          docker build --target mcp-payments -f docker/Dockerfile .
          docker build --target mcp-ledger -f docker/Dockerfile .
