services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gateway
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      support-agent:
        condition: service_healthy

  support-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: support-agent
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      settlement-agent:
        condition: service_healthy

  settlement-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: settlement-agent
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  finance-approval:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: finance-approval
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-orders:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp-orders
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-crm:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp-crm
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-payments:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp-payments
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-ledger:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp-ledger
    env_file:
      - .env
    environment:
      SHOPSPHERE_DATABASE_HOST: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: ${SHOPSPHERE_DATABASE_PASSWORD:-change-me}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm-shopsphere.json:/opt/keycloak/data/import/realm-shopsphere.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "ps -ef | grep -q '[o]rg.keycloak.quarkus.runtime.Main'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opa:
    image: openpolicyagent/opa:0.69.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ./infra/opa/policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
