[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "shopsphere"
version = "0.1.0"
description = "ShopSphere OWASP ASI03 teaching platform scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "ShopSphere Team" }]
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "mcp>=1.12.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "opentelemetry-instrumentation-asgi>=0.49b0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-sdk>=1.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0",
  "mypy>=1.13.0",
  "poethepoet>=0.30.0",
  "pip-audit>=2.8.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.0",
  "testcontainers[postgres]>=4.8.2",
  "aiosqlite>=0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shopsphere"]

[tool.hatch.build.targets.wheel.force-include]
"src/shopsphere/py.typed" = "shopsphere/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "RET", "SIM", "PTH", "ERA", "PL", "RUF", "ASYNC"]
ignore = ["S104", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S106"]
"src/shopsphere/common/persistence/models.py" = ["RUF012"]
"src/shopsphere/mcp_servers/*/api/routes.py" = ["B008"]
"src/shopsphere/support_agent/api/routes.py" = ["B008"]
"src/shopsphere/settlement_agent/api/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
pretty = true
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
addopts = "-q --cov=shopsphere.common --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "unit: unit-level tests",
  "integration: integration tests",
  "attack: adversarial test scenarios",
]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = ["src/shopsphere/common/seed.py"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src tests"
test = "pytest -m unit"
test-integration = "pytest -m integration"
test-attack = "pytest -m attack"
up = "docker compose up --build -d --wait --wait-timeout 300"
down = "docker compose down -v"
migrate = "alembic upgrade head"
seed = "python -m shopsphere.common.seed"
check = ["lint", "typecheck", "test"]
